<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-labelledby="t d">
  <title id="t">Youma — Creative Developer</title>
  <desc id="d">Raphaël Madoré, web developer. Full-stack web apps and interactive experiences.</desc>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#24FBC5" stroke-opacity=".07" stroke-width="1"/>
    </pattern>
    <radialGradient id="glow" cx="78%" cy="50%" r="45%">
      <stop offset="0" stop-color="#24FBC5" stop-opacity=".22"/>
      <stop offset="1" stop-color="#24FBC5" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="fade" x1="0" x2="1">
      <stop offset="0" stop-color="#090909"/>
      <stop offset=".55" stop-color="#090909" stop-opacity=".85"/>
      <stop offset="1" stop-color="#090909" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="card"><rect width="1200" height="320" rx="14"/></clipPath>
    <style>
      .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
      .spin { transform-origin: 940px 160px; animation: spin 48s linear infinite; }
      .spin-r { transform-origin: 940px 160px; animation: spin 72s linear infinite reverse; }
      .pulse { animation: pulse 4s ease-in-out infinite; }
      .blink { animation: blink 1.2s steps(1) infinite; }
      @keyframes spin { to { transform: rotate(360deg); } }
      @keyframes pulse { 0%, 100% { opacity: .35; } 50% { opacity: 1; } }
      @keyframes blink { 50% { opacity: 0; } }
      @media (prefers-reduced-motion: reduce) { .spin, .spin-r, .pulse, .blink { animation: none; } }
    </style>
  </defs>

  <g clip-path="url(#card)">
    <rect width="1200" height="320" fill="#090909"/>
    <rect width="1200" height="320" fill="url(#grid)"/>
    <rect width="1200" height="320" fill="url(#glow)"/>

    <!-- motif géométrique, repris du portfolio -->
    <g fill="none" stroke="#24FBC5">
      <g class="spin">
        <circle cx="940" cy="160" r="118" stroke-opacity=".35" stroke-width="1" stroke-dasharray="2 10"/>
        <rect x="858" y="78" width="164" height="164" stroke-opacity=".55" stroke-width="1.5"/>
      </g>
      <g class="spin-r">
        <rect x="882" y="102" width="116" height="116" stroke-opacity=".9" stroke-width="1.5" transform="rotate(45 940 160)"/>
        <circle cx="940" cy="160" r="150" stroke-opacity=".18" stroke-width="1"/>
      </g>
      <circle cx="940" cy="160" r="34" stroke-opacity=".8" stroke-width="1.5"/>
      <path d="M740 160H906M974 160H1200" stroke-opacity=".3" stroke-width="1"/>
      <path d="M940 0V126M940 194V320" stroke-opacity=".3" stroke-width="1"/>
    </g>
    <circle class="pulse" cx="940" cy="160" r="7" fill="#24FBC5"/>
    <rect x="1090" y="56" width="10" height="10" fill="#24FBC5" opacity=".9"/>
    <rect x="1108" y="56" width="10" height="10" fill="none" stroke="#24FBC5" stroke-opacity=".6"/>
    <rect x="1126" y="56" width="10" height="10" fill="none" stroke="#24FBC5" stroke-opacity=".3"/>

    <rect width="760" height="320" fill="url(#fade)"/>

    <!-- texte -->
    <text x="64" y="92" class="mono" font-size="14" letter-spacing="3" fill="#24FBC5">// RAPHAËL MADORÉ</text>
    <text x="60" y="186" class="sans" font-size="104" font-weight="800" letter-spacing="2" fill="#FFFFFF">YOUMA</text>
    <rect x="64" y="212" width="56" height="4" fill="#24FBC5"/>
    <text x="64" y="256" class="mono" font-size="20" letter-spacing="6" fill="#FFFFFF" fill-opacity=".88">CREATIVE DEVELOPER<tspan class="blink" fill="#24FBC5">_</tspan></text>
    <text x="64" y="286" class="mono" font-size="13" letter-spacing="1.5" fill="#FFFFFF" fill-opacity=".5">full-stack web apps · interactive &amp; 3D experiences</text>
  </g>
  <rect x=".5" y=".5" width="1199" height="319" rx="14" fill="none" stroke="#24FBC5" stroke-opacity=".25"/>
</svg>
